name: C/C++ CI

on: Windows
  push:
    branches: [ "m1.15.5+ny23.03" ]
  pull_request:
    branches: [ "m1.15.5+ny23.03" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
